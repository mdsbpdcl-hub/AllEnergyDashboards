name: Power market data

# Collects IEX prices and Grid-India demand figures into data/power.json.
# Times are in UTC: 04:05 = 9:35 am, 06:35 = 12:05 pm, 08:35 = 2:05 pm, 10:05 = 3:35 pm IST.
# (Grid-India's report for the previous day usually appears in the morning;
#  IEX's day-ahead prices for tomorrow appear around 1 pm.)
on:
  schedule:
    - cron: "5 4 * * *"
    - cron: "35 6 * * *"
    - cron: "35 8 * * *"
    - cron: "5 10 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: power-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4 pandas xlrd openpyxl pdfplumber

      - name: Collect
        run: python scripts/power_collect.py

      - name: Save if changed
        run: |
          git add -N data/ 2>/dev/null || true
          if git diff --quiet -- data/; then
            echo "No change."
            exit 0
          fi
          git config user.name  "power-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Update power market data"
          git pull --rebase --autostash || true
          git push
