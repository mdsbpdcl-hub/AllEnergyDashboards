<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Analytics · Energy Department</title>
<base target="_blank">
<meta name="theme-color" content="#6d4fe0">
<meta name="description" content="Energy Analytics: dashboards and key dates, Energy Department, Government of Bihar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1f2c4d; --muted:#5b6988; --faint:#9aa3b1; --page:#fbfaff; --line:#e6e9ee; --line2:#eef0f3;
  --s:1;
  --display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,"Nirmala UI","Noto Sans Devanagari","Mangal",sans-serif;
  /* calendar colours */
  --gold:#c9961a; --gold-bg:#fffaeb;
  --gh:#c62f3b; --gh-bg:#fdf0f1; --rh:#b8650c; --rh-bg:#fff5e8;
  --en:#0f8273; --en-bg:#e8f6f3; --ob:#4553b8; --ob-bg:#eef0fc;
  --qe:#4a5870; --qe-bg:#f0f2f5; --fc:#8048a6; --fc-bg:#f6effb;
  --dp:#1767b3; --dp-bg:#eaf3fc; --sat:#3b78c2; --sat-bg:#f1f6fd; --sun:#2c62a8; --sun-bg:#e6effa;
  --side-w:470px;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{
  margin:0;font-family:var(--body);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60rem 30rem at 0% 0%,#e6f1ff 0%,rgba(230,241,255,0) 70%),
    radial-gradient(50rem 28rem at 100% 10%,#ffeef3 0%,rgba(255,238,243,0) 70%),
    var(--page);
  background-repeat:no-repeat;
}
button{font:inherit;color:inherit}
.hi{font-family:"Nirmala UI","Noto Sans Devanagari","Mangal","Kohinoor Devanagari",sans-serif}

/* ---------- Two-column shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr) var(--side-w);max-width:1640px;margin:0 auto;align-items:start}

/* ================= LEFT: dashboards ================= */
.page{padding:1.6em 28px 1.2em;font-size:calc(16px * var(--s));min-width:0}
.masthead{margin-bottom:1.4em}
.eyebrow{font-size:.74em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 .25em}
h1{font-family:var(--display);font-weight:700;font-size:2.6em;line-height:1.05;letter-spacing:-.025em;margin:0 0 .2em}
.summary{margin:0;color:var(--muted);font-size:1em;font-weight:500}

.group+.group{margin-top:1.3em}
.group-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4em .8em;margin:0 0 .55em}
.group h2{font-family:var(--display);font-weight:600;font-size:1.3em;letter-spacing:-.015em;line-height:1.2;margin:0}
.open-all{display:inline-flex;align-items:center;gap:.45em;height:2.35em;padding:0 .95em 0 .8em;font:600 .86em var(--body);color:var(--ink);background:#fff;border:1.5px solid #dfe3ee;border-radius:99px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(31,44,77,.06);transition:background-color .2s,border-color .2s,color .2s,transform .15s}
.open-all svg{width:1.15em;height:1.15em;color:#6d4fe0;transition:color .2s}
.open-all .n{font-weight:700;font-size:.85em;background:#efeafd;color:#3a2792;border-radius:99px;padding:.05em .5em}
.open-all:hover,.open-all:focus-visible{background:#6d4fe0;border-color:#6d4fe0;color:#fff}
.open-all:hover svg,.open-all:focus-visible svg{color:#fff}
.open-all:hover .n,.open-all:focus-visible .n{background:rgba(255,255,255,.22);color:#fff}
.open-all:active{transform:scale(.97)}
.open-all:focus-visible{outline:3px solid #b9a9f5;outline-offset:2px}

.toast{position:fixed;left:50%;bottom:16px;z-index:30;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:.7em 1em;font:500 .9rem/1.4 var(--body);color:#fff;background:#1f2c4d;border-radius:14px;box-shadow:0 16px 34px -14px rgba(31,44,77,.6);animation:fade .2s ease both}
.toast.warn{background:#fff6d6;color:#6b4e00;border:1px solid #f3e1a3}
[hidden]{display:none!important}

.tiles{display:grid;gap:.85em;grid-template-columns:repeat(auto-fill,minmax(min(100%,10.75em),1fr))}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:7.75em;padding:.9em;border-radius:20px;background:var(--tint);color:var(--deep);text-decoration:none;box-shadow:0 1px 2px var(--glow);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.tile::before{content:"";position:absolute;right:-2.1em;top:-2.1em;width:6em;height:6em;border-radius:50%;background:rgba(255,255,255,.5);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tile>*{position:relative}
.tile-icon{display:grid;place-items:center;width:2.25em;height:2.25em;border-radius:.7em;background:#fff;color:var(--accent);margin-bottom:.65em;box-shadow:0 4px 10px -4px var(--glow)}
.tile-icon svg{width:1.2em;height:1.2em}
.tile-name,.tile-desc{display:block;overflow-wrap:anywhere}
.tile-name{font-weight:700;font-size:.97em;line-height:1.25;padding-right:1.6em}
.tile-fresh{margin-top:auto;padding-top:.45em;display:flex;align-items:center;gap:.35em;font-size:.72em;font-weight:600;line-height:1.2;color:var(--deep);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-fresh i{flex:0 0 auto;width:.62em;height:.62em;border-radius:50%;background:var(--fc);box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.tile-fresh.g{--fc:#16a34a} .tile-fresh.a{--fc:#f59e0b} .tile-fresh.r{--fc:#dc2626}
.tile-desc{margin-top:.2em;font-size:.8em;line-height:1.35;opacity:.8;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}


.tile-go{position:absolute;top:.75em;right:.75em;display:grid;place-items:center;width:1.75em;height:1.75em;border-radius:50%;background:#fff;color:var(--accent);transition:background-color .3s,color .3s,transform .3s}
.tile-go svg{width:.9em;height:.9em}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);box-shadow:0 14px 24px -12px var(--glow),0 3px 8px var(--glow)}
.tile:hover::before,.tile:focus-visible::before{transform:scale(1.35)}
.tile:hover .tile-go,.tile:focus-visible .tile-go{background:var(--accent);color:#fff;transform:rotate(-45deg)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tile:active{transform:translateY(-1px)}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ================= RIGHT: calendar panel ================= */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 16px 20px 0;font-size:14px;line-height:1.45;scrollbar-width:thin}
.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px -18px rgba(31,44,77,.35);overflow:hidden}
.k-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.k-top h2{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;color:#1f3b63}
.k-top .eyebrow{font-size:10.5px;margin:0}
.k-today{font-size:12px;color:var(--muted);margin-top:1px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;flex:1 0 100%;margin-top:-2px}
.chipbr{flex-basis:100%;height:0}
.wx{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 7px;border-radius:999px;background:#f1f6fd;border:1px solid #dbe7f6;font-size:12px;color:var(--muted);white-space:nowrap}
.wx .ic{font-size:15px;line-height:1}
.wx b{font-size:14px;color:var(--ink);font-weight:700}
.wx .hl{color:var(--faint)}
.aq{background:var(--aqbg,#f0f2f5);border-color:var(--aqbd,#dfe3ee)}
.og{text-decoration:none;background:var(--ogbg,#f0f2f5);border-color:var(--ogbd,#dfe3ee)}
.og b{color:var(--ogc,#444)}
.og:hover{filter:brightness(.97)}
.og .og-s{display:none}
@media (max-width:480px){.og .og-l,.og .og-d{display:none}.og .og-s{display:inline}.chiprow .wx{padding:3px 8px 3px 6px;gap:5px}}
.aq .dot{width:9px;height:9px;border-radius:50%;background:var(--aqc,#888)}
.aq b{color:var(--aqc,#444)}
.badge{flex:0 0 auto;width:46px;height:50px;border-radius:10px;border:1.5px solid var(--gold);background:var(--gold-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.badge b{font-size:20px;color:var(--ink)}
.badge span{font-size:10px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:3px}

.k-sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.k-sec:last-child{border-bottom:0}
.k-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.k-h h3{margin:0;font-size:13px;font-weight:700;color:#1f3b63}
.k-h small{font-weight:500;color:var(--muted);font-size:11.5px}

/* PMSG card */
.pmsg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ps{display:block;text-decoration:none;color:inherit;border-radius:10px;padding:7px 9px 8px;background:var(--b);border-left:3px solid var(--c);transition:filter .15s}
.ps:hover{filter:brightness(.97)}
.ps .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--c);display:flex;justify-content:space-between;gap:4px}
.ps .l span{font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)}
.ps .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:1px}
.ps .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:3px}
.ps .bar{height:5px;border-radius:3px;background:rgba(0,0,0,.08);margin:4px 0 4px;overflow:hidden}
.ps .bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.ps .s{font-size:11px;color:var(--muted);line-height:1.35}
.ps .s b{color:var(--ink);font-weight:700}

/* power market card */
.pm{display:block;text-decoration:none;color:inherit;transition:background .15s}
.pm:hover{background:#faf8ff}
.pm-go{font-size:12px;font-weight:700;color:#6d4fe0}
.pm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pm-it{border-radius:10px;padding:6px 9px;background:var(--b);border-left:3px solid var(--c)}
.pm-it .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
.pm-it .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.pm-it .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px}
.pm-it .s{font-size:11px;color:var(--muted)}

/* filter chips */
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px 3px 7px;font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:#d4d9e1}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}

/* month grid */
.nav{display:flex;align-items:center;gap:4px}
.nav button{border:1px solid var(--line);background:#fff;border-radius:8px;height:26px;min-width:26px;padding:0 7px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.nav button:hover{color:var(--ink);border-color:#cfd5df}
.nav button[disabled]{opacity:.35;cursor:default}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mg .wd{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--muted);padding:2px 0 4px}
.mg .wd.sa{color:var(--sat)} .mg .wd.su{color:var(--sun)}
.mc{position:relative;border:0;background:#fff;border-radius:8px;min-height:62px;padding:4px 2px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:2px;box-shadow:inset 0 0 0 1px var(--line2);min-width:0;text-align:left}
.mc b{font-size:12.5px;font-weight:600;line-height:1;text-align:center;margin-bottom:1px}
.mc .lb{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:normal;word-break:normal;letter-spacing:-.02em;font-size:8.5px;line-height:1.15;font-weight:600;padding:1px 2px 1px 3px;border-radius:3px;border-left:2px solid var(--c);background:var(--cbg);color:var(--c)}
.mc .lb.gh{background:var(--gh);color:#fff;border-left-color:var(--gh)}
.mc .more{font-size:8.5px;color:var(--muted);text-align:center;line-height:1}
.mc.out .lb,.mc.out .more{display:none}
.mc:hover{box-shadow:inset 0 0 0 1px #c9d0db}
.mc.sa{background:var(--sat-bg)} .mc.su{background:var(--sun-bg)}
.mc.sa b{color:var(--sat)} .mc.su b{color:var(--sun)}
.mc.hol{background:var(--gh-bg)} .mc.hol b{color:var(--gh)}
.mc.out{opacity:.35}
.mc.past b{opacity:.55}
.mc.tdy{box-shadow:inset 0 0 0 2px var(--gold);background:var(--gold-bg)}
.mc.sel{box-shadow:inset 0 0 0 2px #1f3b63}
.mc.tdy.sel{box-shadow:inset 0 0 0 2px #1f3b63,inset 0 0 0 4px var(--gold)}
.mc .dots{display:flex;gap:2px;justify-content:center}
.mc .dots span{width:5px;height:5px;border-radius:50%;background:var(--c)}

/* selected day */
.detail .dh{font-weight:600;font-size:13.5px}
.detail .dh span{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.detail .empty{color:var(--muted);font-size:12.5px;margin-top:2px}
.ev{border-left:3px solid var(--c);padding-left:9px;margin-top:6px}
.ev .n{font-weight:600;font-size:13px;line-height:1.35}
.ev .n .en{font-weight:400;color:var(--muted)}
.ev .x{font-size:11.5px;color:var(--muted);margin-top:1px}
.ev .x .tg{color:var(--c);font-weight:700;margin-right:5px}

/* upcoming list */
.mh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#1f3b63;margin:10px 0 2px}
.mh:first-child{margin-top:0}
.it{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.it:last-child{border-bottom:0}
.it:hover .ev .n{text-decoration:underline;text-decoration-color:#c9d0db}
.it .dt{font-weight:700;font-size:15px;line-height:1.1;text-align:center;padding-top:4px}
.it .dt small{display:block;font-weight:600;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.it.sa .dt,.it.sa .dt small{color:var(--sat)} .it.su .dt,.it.su .dt small{color:var(--sun)}
.it.hol .dt,.it.hol .dt small{color:var(--gh)}
.it.tdy{background:var(--gold-bg);border-radius:8px}
.it .ev:first-child{margin-top:0}
.it .rel{font-size:11px;color:var(--muted);grid-column:2}
.it.tdy .rel{color:var(--gold);font-weight:700}
.none{color:var(--muted);font-size:12.5px}

/* ---------- Stacked layout (tablet / phone) ---------- */
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;overflow:visible;padding:0 28px 28px}
  .panel{max-width:640px}
}
@media (max-width:600px){
  .page{padding:1.2em 12px 1em;font-size:calc(15px * var(--s))}
  .masthead{margin-bottom:1em}
  h1{font-size:1.9em}
  .summary{font-size:.9em}
  .group h2{font-size:1.1em}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:.55em}
  .tile{padding:.65em;min-height:6.6em;border-radius:14px}
  .tile-icon{width:1.95em;height:1.95em;margin-bottom:.5em;border-radius:.6em}
  .tile-name{font-size:.9em;line-height:1.22;padding-right:0}
  .tile-desc{font-size:.72em}
  .tile-go{top:.55em;right:.55em;width:1.5em;height:1.5em}
  .tile-fresh .tm{display:none}
  .side{padding:0 12px 20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="shell">

  <!-- ================= Dashboards ================= -->
  <main class="page" id="main">
    <header class="masthead">
      <p class="eyebrow">Energy Department · Government of Bihar</p>
      <h1>Energy Analytics</h1>
      <p class="summary" id="summary"></p>
    </header>
    <div id="groups"></div>
  </main>

  <!-- ================= Key dates panel ================= -->
  <aside class="side" aria-label="Key dates and holidays">
    <div class="panel">
      <div class="k-top">
        <div>
          <p class="eyebrow">Key Dates &amp; Holidays</p>
          <h2 id="kDate"></h2>
          <div class="k-today" id="kSub"></div>
        </div>
        <div class="badge"><b id="tNum"></b><span id="tMon"></span></div>
        <div class="chiprow"><div class="wx" id="wx" hidden></div><span class="chipbr"></span><div class="wx aq" id="aq" hidden></div><a class="wx og" id="og" hidden target="_blank" rel="noopener" href="https://sites.google.com/view/energy-department-analytics/dailymonitoring/outage"></a></div>
      </div>

      <div class="k-sec pmsg" id="pmsg" hidden>
        <div class="k-h"><h3>PM Surya Ghar <small id="pmsgWhen"></small></h3></div>
        <div class="pmsg-grid" id="pmsgGrid"></div>
      </div>

      <a class="k-sec pm" id="pm" href="https://sites.google.com/view/energy-department-analytics/dailymonitoring/power-market" target="_blank" rel="noopener" hidden>
        <div class="k-h"><h3>Power market <small id="pmWhen"></small></h3><span class="pm-go">Open ›</span></div>
        <div class="pm-grid" id="pmGrid"></div>
      </a>

      <div class="k-sec">
        <div class="k-h">
          <h3 id="mTitle"></h3>
          <div class="nav">
            <button type="button" id="mPrev" aria-label="Previous month">‹</button>
            <button type="button" id="mToday">Today</button>
            <button type="button" id="mNext" aria-label="Next month">›</button>
          </div>
        </div>
        <div class="mg" id="month"></div>
      </div>

      <div class="k-sec detail" id="detail"></div>

      <div class="k-sec">
        <div class="k-h"><h3>Show</h3></div>
        <div class="chips" id="chips"></div>
      </div>

      <div class="k-sec">
        <div class="k-h"><h3>Coming up <small id="winTxt"></small></h3></div>
        <div id="list"></div>
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* =====================================================================
   DASHBOARDS — edit here (same columns as the Google Sheet)
   name | url | desc | cat
   Groups appear in the order of CATEGORY_ORDER; any new category is
   added after them automatically.
   ===================================================================== */
const CATEGORY_ORDER = ['Priority', 'SBPDCL', 'Others'];

const DASHBOARDS = [
  // ---- Priority ----
  { name: 'Daily Bulletin', url: 'https://sites.google.com/view/energy-department-analytics/energy-bulletin', desc: 'Summary of Priorities', cat: 'Priority' },
  { name: 'Pending Issues', url: 'https://sites.google.com/view/energy-department-analytics/followup', desc: 'Pending Issues District Wise', cat: 'Priority' },
  { name: 'Weather Prediction', url: 'https://sites.google.com/view/energy-department-analytics/dailymonitoring/weatherforecast', desc: 'Forecast of Outage and Complaints', cat: 'Priority' },
  { name: 'CMD Cell Monitoring Sheet', url: 'https://sites.google.com/view/energy-department-analytics/dailymonitoring/daily-monitoring', desc: 'PwC Agenda Sheet', cat: 'Priority' },
  { name: 'BSPHCL Daily News Briefing', url: 'https://sites.google.com/view/energy-department-analytics/dailymonitoring/daily-news', desc: 'Daily News Summary', cat: 'Priority' },
  { name: 'PMSG-MBY (Regular)', url: 'https://sites.google.com/view/energy-department-analytics/pmsg/pmsg-mby-regular', desc: 'PMSG Dashboard for Districts', cat: 'Priority' },
  { name: 'PMSG-MBY (ULA)', url: 'https://sites.google.com/view/energy-department-analytics/pmsg/pmsg-mby-ula', desc: 'PMSG (ULA) Dashboard for Agencies', cat: 'Priority' },
  { name: '1912 Complaint Analytics', url: 'https://sites.google.com/view/energy-department-analytics/dailymonitoring/1912', desc: 'Consumer Complaints Statistics', cat: 'Priority' },

  const OPEN_ALL_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-8A2.5 2.5 0 0 0 3 6.5v8A2.5 2.5 0 0 0 5.5 17H8"/></svg>';
  const OTHER='Other dashboards';

  const root=document.documentElement;
  const $=id=>document.getElementById(id);
  const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
  const plural=(n,w)=>n+' '+w+(n===1?'':'s');

  /* Fit the dashboards column on one screen (wide screens only) */
  function fit(){
    const main=$('main');
    let s=1;
    root.style.setProperty('--s',s);
    root.classList.remove('compact');
    if(window.innerWidth<=1000) return;            // stacked layout scrolls normally
    const fits=()=>main.offsetHeight<=window.innerHeight+1;
    if(fits()) return;
    // Descriptions always stay visible; only the size shrinks (page scrolls past 0.8)
    while(!fits() && s>0.8){
      s=Math.max(0.8,Math.round((s-0.02)*100)/100);
      root.style.setProperty('--s',s);
    }
  }
  let fitTimer;
  window.addEventListener('resize',()=>{clearTimeout(fitTimer);fitTimer=setTimeout(fit,80);});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
  // fonts now load in the background, so re-fit when they arrive
  if(document.fonts&&document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',()=>{clearTimeout(fitTimer);fitTimer=setTimeout(fit,50);});
  window.addEventListener('load',()=>setTimeout(fit,100));

  let toastTimer;
  function toast(text,warn){
    const t=$('toast');
    t.textContent=text; t.className='toast'+(warn?' warn':''); t.hidden=false;
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.hidden=true;},warn?9000:4000);
  }

  function openAll(group){
    let opened=0, blocked=0;
    group.items.forEach(d=>{
      let w=null;
      try{ w=window.open('about:blank','_blank'); }catch(e){}
      if(w){ try{w.opener=null;}catch(e){} w.location.href=d.url; opened++; }
      else blocked++;
    });
    if(blocked>0) toast('Your browser blocked '+plural(blocked,'tab')+'. Allow pop-ups for this page (icon at the right end of the address bar), then press Open all again.',true);
    else toast('Opened '+plural(opened,'dashboard')+'.',false);
  }

  /* Data freshness: d.dataAt = when the dashboard's source sheet last changed,
     d.freq = Daily (default) / Weekly / Monthly. Colour is judged at viewing time. */
  const IST=19800000, DAYMS=864e5;
  const istDay=t=>Math.floor((t+IST)/DAYMS);
  const LIMITS={daily:[0,1],weekly:[7,10],monthly:[31,40]};   // [green up to, amber up to] days
  function freshness(d){
    const t=Date.parse(d&&d.dataAt||''); if(isNaN(t)) return null;
    const age=istDay(Date.now())-istDay(t);
    const lim=LIMITS[String(d.freq||'daily').toLowerCase()]||LIMITS.daily;
    const cls=age<=lim[0]?'g':age<=lim[1]?'a':'r';
    const time=new Date(t).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit'});
    const date=new Date(t).toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short'});
    const text=age<=0?'Today':age===1?'Yesterday':age+' days ago';
    const tm=age<=1?', '+time:'';
    return {cls, text, tm, title:'Data last updated '+date+', '+time+(d.freq?' · expected '+d.freq:'')};
  }
  // Recolour the dots once an hour, so a page left open stays correct
  setInterval(()=>{ if(window.__lastTiles) buildTiles.apply(null,window.__lastTiles); }, 3600e3);

  /* Build the tiles from a list (from dashboards.json, or the built-in list) */
  function buildTiles(list, updated){
    window.__lastTiles=[list,updated];
    $('groups').textContent='';
    /* Build groups */
    const groups=[], lookup=new Map();
    list.forEach(d=>{
      if(!d||!d.name||!/^https?:\/\//i.test(d.url||'')) return;
      const k=(d.cat||'').trim()||OTHER;
      if(!lookup.has(k)){ lookup.set(k,{name:k,items:[]}); groups.push(lookup.get(k)); }
      lookup.get(k).items.push(d);
    });
    const firstSeen=new Map(groups.map((g,i)=>[g.name,i]));
    const rank=n=>{const i=CATEGORY_ORDER.indexOf(n);return i<0?CATEGORY_ORDER.length+firstSeen.get(n):i;};
    groups.sort((a,b)=>rank(a.name)-rank(b.name));
    const total=groups.reduce((s,g)=>s+g.items.length,0);
    $('summary').textContent=plural(total,'dashboard')+(groups.length>1?' across '+plural(groups.length,'category').replace('categorys','categories'):'')+(updated?' · list updated '+updated:'');

    let index=0;
    groups.forEach(g=>{
      const section=el('section','group');
      const head=el('div','group-head');
      head.appendChild(el('h2',null,g.name));
      const btn=el('button','open-all');
      btn.type='button';
      btn.innerHTML=OPEN_ALL_ICON;
      btn.appendChild(el('span',null,'Open all'));
      btn.appendChild(el('span','n',String(g.items.length)));
      btn.title='Opens '+plural(g.items.length,'dashboard')+' in new tabs.';
      btn.setAttribute('aria-label','Open all '+plural(g.items.length,'dashboard')+' in '+g.name);
      btn.addEventListener('click',()=>openAll(g));
      head.appendChild(btn);
      section.appendChild(head);

      const grid=el('div','tiles');
      g.items.forEach(d=>{
        const c=PALETTE[index%PALETTE.length];
        const a=el('a','tile');
        a.href=d.url; a.target='_blank'; a.rel='noopener';
        a.style.setProperty('--tint',c.tint); a.style.setProperty('--accent',c.accent);
        a.style.setProperty('--deep',c.deep); a.style.setProperty('--glow',c.glow);
        const icon=el('span','tile-icon');
        icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICONS[index%ICONS.length]+'</svg>';
        icon.setAttribute('aria-hidden','true');
        a.appendChild(icon);
        a.appendChild(el('span','tile-name',d.name));
        const desc=(d.desc||'').trim();
        if(desc&&desc.toLowerCase()!==d.name.toLowerCase()){
          a.appendChild(el('span','tile-desc',desc));
          a.title=d.name+' - '+desc;
        }
        const fr=freshness(d);
        if(fr){
          const f=el('span','tile-fresh '+fr.cls); f.title=fr.title;
          f.appendChild(el('i')); const ft=el('span',null,fr.text); if(fr.tm) ft.appendChild(el('span','tm',fr.tm)); f.appendChild(ft);
          a.appendChild(f);
        }
        const go=el('span','tile-go'); go.innerHTML=ARROW; go.setAttribute('aria-hidden','true');
        a.appendChild(go);
        grid.appendChild(a);
        index++;
      });
      section.appendChild(grid);
      $('groups').appendChild(section);
    });
    fit();
  }

  /* Load the latest list published from the Google Sheet (dashboards.json).
     If it can't be read (e.g. the file opened from disk), use the built-in list. */
  const fmtUpdated=t=>{ const d=new Date(t); return isNaN(d)?'':d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}); };
  // 1) Draw at once from the saved copy (instant on repeat visits).
  // 2) Ask GitHub for the latest list in the background; redraw only if it changed.
  let shown=null;                                   // items currently on screen, as text
  const valid=j=>(j&&Array.isArray(j.items))?j.items.filter(d=>d&&d.name&&/^https?:\/\//i.test(d.url||'')):[];
  const show=j=>{
    if(j&&j.pmsg&&window.renderPmsg) window.renderPmsg(j.pmsg);
    if(j&&j.outage&&window.renderOutage) window.renderOutage(j.outage);
    const items=valid(j); if(!items.length) return false;
    const sig=JSON.stringify(items);
    if(sig===shown) return true;                     // same list: nothing to redraw
    shown=sig; buildTiles(items, fmtUpdated(j.updated)); return true;
  };
  const getList=url=>fetch(url,{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(r.status));
  const timer=setTimeout(()=>{ if(shown===null){ shown='builtin'; buildTiles(DASHBOARDS,''); } },4000);
  getList('dashboards.json')
    .then(j=>{ if(show(j)) clearTimeout(timer); else throw 'empty'; })
    .catch(()=>{ clearTimeout(timer); if(shown===null){ shown='builtin'; buildTiles(DASHBOARDS,''); } })
    .then(()=>{
      // Only needed when the copy above came from this computer's cache
      if(navigator.serviceWorker&&navigator.serviceWorker.controller)
        return getList('dashboards.json?fresh='+Date.now()).then(show);
    })
    .catch(()=>{});
})();

  function rel(d){

  let active=new Set(ORDER.filter(c=>c!=='fc')), sel=null, T=null, M={}, vY=0, vM=0, minYM=0, maxYM=0;
  try{const s=JSON.parse(localStorage.getItem('kd2')||'null'); if(Array.isArray(s)) active=new Set(s);}catch(e){}
  const save=()=>{try{localStorage.setItem('kd2',JSON.stringify([...active]))}catch(e){}};

  function build(){
    const L=[];
    FIXED.forEach(([d,c,hi,en,n])=>L.push({d,c,hi,en,n}));
    DEPT_EVENTS.forEach(([d,t,n])=>L.push({d,c:'dp',hi:'',en:t,n}));
    const Y=D(T).getUTCFullYear();
    for(let y=Y-1;y<=Y+1;y++) yearly(L,y);
    minYM=(Y-1)*12; maxYM=(Y+1)*12+11;
    M={}; L.forEach(e=>{(M[e.d]=M[e.d]||[]).push(e)});
    Object.values(M).forEach(a=>a.sort((x,y)=>ORDER.indexOf(x.c)-ORDER.indexOf(y.c)));
  }
  const all=n=>M[key(n)]||[];
  const vis=n=>all(n).filter(e=>active.has(e.c));
  const hol=n=>active.has('gh')&&all(n).some(e=>e.c==='gh');
  const st=c=>`--c:var(--${c});--cbg:var(--${c}-bg)`;
  const short=e=>(e.en||e.hi).split(/ \/ | – | \(/)[0];
  const nameOf=e=>e.hi?`${e.hi}${e.en?' · '+e.en:''}`:e.en;

  function evFull(e){
    const name=e.hi?`<span class="hi">${e.hi}</span>${e.en?` <span class="en">· ${e.en}</span>`:''}`:e.en;
    return `<div class="ev" style="${st(e.c)}"><div class="n">${name}</div>
      <div class="x"><span class="tg">${CAT[e.c].label}</span>${e.n?e.n:''}</div></div>`;
  }

  function header(){
    $('kDate').textContent=F(T,{weekday:'long',day:'numeric',month:'long'});
    $('kSub').textContent=F(T,{year:'numeric'})+' · Energy Department, Bihar';
    $('tNum').textContent=D(T).getUTCDate();
    $('tMon').textContent=F(T,{month:'short'});
    $('winTxt').textContent=`· next ${AHEAD} days`;
  }

  function chips(){
    const used=ORDER.filter(c=>c!=='dp'||DEPT_EVENTS.length);
    $('chips').innerHTML=used.map(c=>`<button type="button" class="chip" data-c="${c}" aria-pressed="${active.has(c)}" style="${st(c)}"><i></i>${CAT[c].label}</button>`).join('');
    $('chips').querySelectorAll('button.chip').forEach(b=>b.onclick=()=>{
      const c=b.dataset.c; active.has(c)?active.delete(c):active.add(c); save(); draw();
    });
  }

  function month(){
    const first=dn(vY,vM+1,1);
    const days=new Date(Date.UTC(vY,vM+1,0)).getUTCDate();
    const last=first+days-1;
    const g0=first-mon0(first), g1=last+(6-mon0(last));
    $('mTitle').textContent=F(first,{month:'long',year:'numeric'});
    const ym=vY*12+vM;
    $('mPrev').disabled=ym<=minYM; $('mNext').disabled=ym>=maxYM;
    let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="wd ${i===5?'sa':i===6?'su':''}">${d.slice(0,2)}</div>`).join('');
    for(let n=g0;n<=g1;n++){
      const w=dow(n), a=vis(n), c=['mc'];
      if(w===6)c.push('sa'); if(w===0)c.push('su'); if(hol(n))c.push('hol');
      if(n<first||n>last)c.push('out'); else if(n<T)c.push('past');
      if(n===T)c.push('tdy'); if(n===sel)c.push('sel');
      const labels=a.filter(x=>x.c!=='fc').slice(0,2);
      const rest=a.length-labels.length;
      const tip=F(n,{weekday:'short',day:'numeric',month:'short'})+(a.length?'\n'+a.map(nameOf).join('\n'):'');
      h+=`<button type="button" class="${c.join(' ')}" data-n="${n}" title="${tip.replace(/"/g,'&quot;')}"><b>${D(n).getUTCDate()}</b>`
        +labels.map(x=>`<span class="lb ${x.c==='gh'?'gh':''}" style="${st(x.c)}">${short(x)}</span>`).join('')
        +(rest>0?`<span class="more">+${rest}</span>`:'')+`</button>`;
    }
    $('month').innerHTML=h;
    $('month').querySelectorAll('.mc').forEach(b=>b.onclick=()=>select(+b.dataset.n));
  }

  function select(n){
    sel=n;
    const d=D(n);
    if(d.getUTCFullYear()!==vY||d.getUTCMonth()!==vM){ vY=d.getUTCFullYear(); vM=d.getUTCMonth(); month(); }
    document.querySelectorAll('.mc.sel').forEach(x=>x.classList.remove('sel'));
    const el=document.querySelector(`.mc[data-n="${n}"]`); if(el) el.classList.add('sel');
    const w=dow(n), a=vis(n);
    $('detail').innerHTML=`<div class="dh">${F(n,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}<span>${rel(n-T)}${w===6?' · Saturday':w===0?' · Sunday':''}</span></div>
      ${a.length?a.map(evFull).join(''):'<div class="empty">No listed events.</div>'}`;
  }

  function list(){
    let h='', lastM=-1;
    for(let n=T;n<=T+AHEAD;n++){
      const a=vis(n); if(!a.length&&n!==T) continue;
      const d=D(n), w=dow(n);
      if(d.getUTCMonth()!==lastM){ lastM=d.getUTCMonth(); h+=`<div class="mh">${F(n,{month:'long',year:'numeric'})}</div>`; }
      const c=['it']; if(w===6)c.push('sa'); if(w===0)c.push('su'); if(hol(n))c.push('hol'); if(n===T)c.push('tdy');
      h+=`<div class="${c.join(' ')}" data-n="${n}"><div class="dt">${d.getUTCDate()}<small>${F(n,{weekday:'short'})}</small></div>
        <div>${a.length?a.map(evFull).join(''):'<div class="ev" style="--c:var(--gold)"><div class="x">No listed events today</div></div>'}</div>
        <div class="rel">${rel(n-T)}</div></div>`;
    }
    $('list').innerHTML=h||'<div class="none">Nothing to show for the selected filters.</div>';
    $('list').querySelectorAll('.it').forEach(r=>r.onclick=()=>{select(+r.dataset.n);$('month').scrollIntoView({behavior:'smooth',block:'start'});});
  }

  function draw(){ chips(); month(); list(); select(sel); }
  function render(){
    T=todayNum(); build(); sel=T;
    vY=D(T).getUTCFullYear(); vM=D(T).getUTCMonth();
    header(); draw();
  }

  $('mPrev').onclick=()=>{ if(--vM<0){vM=11;vY--;} month(); };
  $('mNext').onclick=()=>{ if(++vM>11){vM=0;vY++;} month(); };
  $('mToday').onclick=()=>select(T);

  render();
  function midnight(){ setTimeout(()=>{render();midnight();}, DAY-((Date.now()+IST)%DAY)+2000); }
  midnight();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&todayNum()!==T) render(); });
})();
</script>
<script>
/* =====================================================================
   WEATHER — current temperature from Open-Meteo (free, no key needed).
   Change the place here if you want another city.
   ===================================================================== */
const WEATHER_PLACE = { name: 'Patna', lat: 25.5941, lon: 85.1376 };
(function(){
  const box=document.getElementById('wx'); if(!box) return;
  const KEY='wx1', FRESH=30*60*1000;                 // refresh every 30 minutes
  const CODES={0:['☀️','Clear'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Fog'],48:['🌫️','Fog'],
    51:['🌦️','Drizzle'],53:['🌦️','Drizzle'],55:['🌦️','Drizzle'],56:['🌦️','Drizzle'],57:['🌦️','Drizzle'],
    61:['🌧️','Rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🌧️','Rain'],67:['🌧️','Heavy rain'],
    71:['🌨️','Snow'],73:['🌨️','Snow'],75:['🌨️','Snow'],77:['🌨️','Snow'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],
    85:['🌨️','Snow showers'],86:['🌨️','Snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Thunderstorm']};
  const r=n=>Math.round(n);
  function show(w){
    if(!w||w.t==null) return;
    let [ic,txt]=CODES[w.code]||['🌡️',''];
    if(!w.day && (w.code===0||w.code===1)) ic='🌙';
    box.innerHTML='';
    const add=(cls,t)=>{const s=document.createElement('span'); if(cls) s.className=cls; s.textContent=t; box.appendChild(s); return s;};
    add('ic',ic); const b=document.createElement('b'); b.textContent=r(w.t)+'°C'; box.appendChild(b);
    add('',WEATHER_PLACE.name+(txt?' · '+txt:''));
    if(w.max!=null) add('hl','↑'+r(w.max)+'° ↓'+r(w.min)+'°');
    box.title='Feels like '+r(w.feels)+'°C · updated '+new Date(w.at).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
    box.hidden=false;
  }
  function load(){
    const u='https://api.open-meteo.com/v1/forecast?latitude='+WEATHER_PLACE.lat+'&longitude='+WEATHER_PLACE.lon+
      '&current=temperature_2m,apparent_temperature,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FKolkata&forecast_days=1';
    fetch(u).then(x=>x.ok?x.json():Promise.reject(x.status)).then(j=>{
      const c=j.current||{}, d=j.daily||{};
      const w={t:c.temperature_2m,feels:c.apparent_temperature,code:c.weather_code,day:c.is_day===1,
        max:d.temperature_2m_max&&d.temperature_2m_max[0],min:d.temperature_2m_min&&d.temperature_2m_min[0],at:Date.now()};
      show(w); try{localStorage.setItem(KEY,JSON.stringify(w))}catch(e){}
    }).catch(()=>{});                                   // no internet: keep the last reading (or stay hidden)
  }
  let saved=null; try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(saved) show(saved);                                // instant: last known reading
  if(!saved||Date.now()-saved.at>FRESH) load(); else setTimeout(load, FRESH-(Date.now()-saved.at));
  setInterval(load, FRESH);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ let s=null; try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){} if(!s||Date.now()-s.at>FRESH) load(); } });
})();

/* =====================================================================
   AIR QUALITY — estimated Indian AQI (CPCB method) for the same place,
   from the 24-hour average of modelled PM2.5 and PM10 (Open-Meteo, free).
   It is an estimate, not an official CPCB station reading.
   ===================================================================== */
(function(){
  const box=document.getElementById('aq'); if(!box) return;
  const KEY='aq1', FRESH=60*60*1000;
  // CPCB breakpoints: [concentration low, high, index low, high]
  const BP={pm25:[[0,30,0,50],[30,60,51,100],[60,90,101,200],[90,120,201,300],[120,250,301,400],[250,500,401,500]],
            pm10:[[0,50,0,50],[50,100,51,100],[100,250,101,200],[250,350,201,300],[350,430,301,400],[430,600,401,500]]};
  const CAT=[[50,'Good','#15803d','#e7f6ec','#bfe5cb'],[100,'Satisfactory','#4d7c0f','#f0f7e4','#d3e8b4'],
             [200,'Moderate','#a16207','#fdf6dc','#f1e0a0'],[300,'Poor','#c2410c','#fff0e6','#f8cdb0'],
             [400,'Very poor','#b91c1c','#fdecec','#f4bcbc'],[1e9,'Severe','#7e22ce','#f5ecfd','#dcc2f5']];
  function sub(c,table){
    if(c==null||isNaN(c)) return null;
    for(const [cl,ch,il,ih] of table) if(c<=ch) return il+(ih-il)*(c-cl)/(ch-cl);
    return 500;
  }
  const avg24=(times,vals,nowKey)=>{
    let end=times.indexOf(nowKey); if(end<0) end=times.length-1;
    const v=vals.slice(Math.max(0,end-23),end+1).filter(x=>x!=null);
    return v.length>=16?v.reduce((a,b)=>a+b,0)/v.length:null;   // CPCB needs at least 16 hours
  };
  function show(a){
    if(!a||a.aqi==null) return;
    const c=CAT.find(x=>a.aqi<=x[0]);
    box.style.setProperty('--aqc',c[2]); box.style.setProperty('--aqbg',c[3]); box.style.setProperty('--aqbd',c[4]);
    box.innerHTML='';
    const dot=document.createElement('span'); dot.className='dot'; box.appendChild(dot);
    const b=document.createElement('b'); b.textContent='AQI '+Math.round(a.aqi); box.appendChild(b);
    const t=document.createElement('span'); t.textContent=c[1]; box.appendChild(t);
    box.title='Estimated Indian AQI for '+WEATHER_PLACE.name+' (24-hour average): PM2.5 '+Math.round(a.pm25)+' µg/m³, PM10 '+Math.round(a.pm10)+
      ' µg/m³. Main pollutant: '+a.main+'. Modelled data from Open-Meteo, not an official CPCB reading. Updated '+
      new Date(a.at).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
    box.hidden=false;
  }
  function load(){
    const u='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+WEATHER_PLACE.lat+'&longitude='+WEATHER_PLACE.lon+
      '&hourly=pm10,pm2_5&past_days=1&forecast_days=1&timezone=Asia%2FKolkata';
    fetch(u).then(x=>x.ok?x.json():Promise.reject(x.status)).then(j=>{
      const h=j.hourly||{}, times=h.time||[];
      const nowKey=new Date(Date.now()+19800000).toISOString().slice(0,13)+':00';
      const pm25=avg24(times,h.pm2_5||[],nowKey), pm10=avg24(times,h.pm10||[],nowKey);
      const s25=sub(pm25,BP.pm25), s10=sub(pm10,BP.pm10);
      if(s25==null&&s10==null) return;
      const a={aqi:Math.max(s25||0,s10||0),pm25:pm25||0,pm10:pm10||0,main:(s25||0)>=(s10||0)?'PM2.5':'PM10',at:Date.now()};
      show(a); try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}
    }).catch(()=>{});
  }
  let saved=null; try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(saved) show(saved);
  if(!saved||Date.now()-saved.at>FRESH) load();
  setInterval(load, FRESH);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ let s=null; try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){} if(!s||Date.now()-s.at>FRESH) load(); } });
})();
</script>
<script>
/* =====================================================================
   POWER MARKET card — reads data/power.json (filled daily by the GitHub job)
   ===================================================================== */
(function(){
  const box=document.getElementById('pm'); if(!box) return;
  const IST=19800000, DAY=864e5;
  const key=t=>new Date(t+IST).toISOString().slice(0,10);
  const T=key(Date.now()), Y=key(Date.now()-DAY), TM=key(Date.now()+DAY);
  const fd=k=>new Date(k+'T00:00:00Z').toLocaleDateString('en-IN',{timeZone:'UTC',day:'numeric',month:'short'});
  const last=(o,max)=>Object.keys(o||{}).filter(k=>!max||k<=max).sort().pop();
  const item=(l,v,u,sub,c,b)=>`<div class="pm-it" style="--c:${c};--b:${b}"><div class="l">${l}</div><div class="v">${v}<small>${u}</small></div><div class="s">${sub}</div></div>`;
  let shown='';
  function show(J){
    const s=JSON.stringify(J); if(s===shown) return; shown=s;
    const dam=(J.iex||{}).dam||{}, rtm=(J.iex||{}).rtm||{}, G=J.grid||{};
    let h='';
    const dk=dam[TM]?TM:dam[T]?T:last(dam,T);
    if(dk) h+=item('IEX DAM',(dam[dk].avg/1000).toFixed(2),'₹/unit',dk===TM?'tomorrow':dk===T?'today':fd(dk),'#1f7fd6','#eef5fd');
    const rk=last(rtm,Y);
    if(rk) h+=item('IEX RTM',(rtm[rk].avg/1000).toFixed(2),'₹/unit',rk===Y?'yesterday':fd(rk),'#c2570f','#fff3ea');
    const gk=last(G);
    if(gk&&G[gk].all_peak_mw!=null) h+=item('India peak',(G[gk].all_peak_mw/1000).toFixed(1),'GW',fd(gk)+(G[gk].all_peak_time?' · '+G[gk].all_peak_time:''),'#0f7a52','#e9f7f0');
    if(gk&&G[gk].bihar_peak_mw!=null) h+=item('Bihar peak',Math.round(G[gk].bihar_peak_mw).toLocaleString('en-IN'),'MW',fd(gk)+(G[gk].bihar_energy_mu!=null?' · '+G[gk].bihar_energy_mu.toFixed(1)+' MU':''),'#b8285c','#fdeef3');
    const C=J.cea||{}, ck=Object.keys(C).sort().filter(k=>C[k].bihar), lk=ck[ck.length-1];
    const fm=k=>new Date(k+'-01T00:00:00Z').toLocaleDateString('en-IN',{timeZone:'UTC',month:'short',year:'2-digit'});
    if(!(gk&&G[gk].bihar_peak_mw!=null)&&lk){
      if(C[lk].all&&C[lk].all.peak_demand_mw) h+=item('India peak',(C[lk].all.peak_demand_mw/1000).toFixed(1),'GW',fm(lk)+' (month)','#0f7a52','#e9f7f0');
      h+=item('Bihar peak',Math.round(C[lk].bihar.peak_demand_mw).toLocaleString('en-IN'),'MW',fm(lk)+' (month)','#b8285c','#fdeef3');
    }
    if(!h) return;
    document.getElementById('pmGrid').innerHTML=h;
    box.hidden=false;
  }
  const get=u=>fetch(u,{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(r.status));
  get('data/power.json').then(show).catch(()=>{})
    .then(()=>{ if(navigator.serviceWorker&&navigator.serviceWorker.controller) return get('data/power.json?fresh='+Date.now()).then(show); })
    .catch(()=>{});
})();
</script>
<script>
/* =====================================================================
   PM SURYA GHAR card — figures published from the PMSG sheets with the tile list
   ===================================================================== */
window.renderOutage=function(O){
  const box=document.getElementById('og'); if(!box||!O||O.avg_min==null) return;
  const m=O.avg_min, c=m<=30?['#15803d','#e7f6ec','#bfe5cb']:m<=60?['#a16207','#fdf6dc','#f1e0a0']:['#b91c1c','#fdecec','#f4bcbc'];
  box.style.setProperty('--ogc',c[0]); box.style.setProperty('--ogbg',c[1]); box.style.setProperty('--ogbd',c[2]);
  const hm=x=>{const t=Math.round(x); return t>=60?Math.floor(t/60)+'h '+String(t%60).padStart(2,'0')+'m':t+' min';};
  const d=new Date(String(O.date).replace(/-/g,' ')), ds=isNaN(d)?O.date:d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  box.innerHTML=''; const add=(tag,cls,t)=>{const e=document.createElement(tag); if(cls) e.className=cls; e.textContent=t; box.appendChild(e); return e;};
  add('span','ic','⚡'); add('b',null,hm(m)); add('span','og-l','outage / feeder'); add('span','og-s','/ feeder'); add('span','og-d','· '+ds);
  box.title='Bihar average outage per feeder on '+ds+(O.complete?'':' (one DISCOM only)')+
    (O.sbpdcl_min!=null?' · SBPDCL '+hm(O.sbpdcl_min):'')+(O.nbpdcl_min!=null?' · NBPDCL '+hm(O.nbpdcl_min):'')+
    (O.interruptions_per_feeder!=null?' · '+O.interruptions_per_feeder+' interruptions per feeder':'')+
    (O.over4h!=null?' · '+O.over4h+' feeders out over 4 hours':'');
  box.hidden=false;
};
window.renderPmsg=function(P){
  const box=document.getElementById('pmsg'); if(!box||!P) return;
  const fmt=v=>v==null?'–':Math.round(v).toLocaleString('en-IN');
  const pc=(a,b)=>a!=null&&b?Math.min(100,a/b*100):null;
  const LINK_REG='https://sites.google.com/view/energy-department-analytics/pmsg/pmsg-mby-regular';
  const LINK_ULA='https://sites.google.com/view/energy-department-analytics/pmsg/pmsg-mby-ula';
  let h='';
  const R=P.regular;
  if(R&&R.installed!=null){
    const p=pc(R.installed,R.target);
    h+=`<a class="ps" href="${LINK_REG}" target="_blank" rel="noopener" style="--c:#c27a00;--b:#fff7e6" title="PMSG-MBY (Regular), Bihar">
      <div class="l">Regular<span>${p!=null?p.toFixed(1)+'%':''}</span></div>
      <div class="v">${fmt(R.installed)}<small>installed</small></div>
      <div class="bar"><i style="width:${p||0}%"></i></div>
      <div class="s">of ${fmt(R.target)} target<br>${R.last7!=null?'<b>+'+fmt(R.last7)+'</b> in 7 days':''}${R.capacity_kw!=null?' · '+(R.capacity_kw/1000).toFixed(1)+' MW':''}</div></a>`;
  }
  const U=P.ula;
  if(U&&U.portal!=null){
    const p=pc(U.portal,U.target), pp=pc(U.portal,U.inverters);
    h+=`<a class="ps" href="${LINK_ULA}" target="_blank" rel="noopener" style="--c:#0f7a8a;--b:#e8f6f8" title="PMSG-MBY (ULA): updated on PM Surya Ghar portal and inverters installed">
      <div class="l">ULA<span>${p!=null?p.toFixed(1)+'%':''}</span></div>
      <div class="v">${fmt(U.portal)}<small>on portal</small></div>
      <div class="bar"><i style="width:${p||0}%"></i></div>
      <div class="s">of ${fmt(U.target)} target<br><b>${fmt(U.inverters)}</b> inverters installed${pp!=null?' ('+pp.toFixed(0)+'% updated)':''}</div></a>`;
  }
  if(!h) return;
  document.getElementById('pmsgGrid').innerHTML=h;
  const when=(U&&U.asOf)||(R&&R.asOf&&R.asOf.slice(0,10));
  document.getElementById('pmsgWhen').textContent=when?'· '+new Date(when+'T00:00:00Z').toLocaleDateString('en-IN',{timeZone:'UTC',day:'numeric',month:'short'}):'';
  box.hidden=false;
};
</script>
